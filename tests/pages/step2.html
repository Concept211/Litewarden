<!doctype html><html><head><meta charset="utf-8"><title>Two-step: password</title><link rel="stylesheet" href="_base.css"></head><body>
<header>Two-step sign in</header><main><form onsubmit="event.preventDefault()"><p id="who"></p><input type="hidden" name="username" autocomplete="username" id="hu">
<label for="p">Password</label><div class="f"><input id="p" type="password" autocomplete="current-password"></div>
<button type="submit">Sign in</button></form></main><script>const e=new URLSearchParams(location.search).get('email')||'';who.textContent='Signing in as '+e;hu.value=e;</script></body></html>
