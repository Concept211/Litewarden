<!doctype html><html><head><meta charset="utf-8"><title>SPA login over fetch</title><link rel="stylesheet" href="_base.css"></head><body>
<header>App that signs in with fetch</header><main><div id="root" class="card"><div><label>Email</label><div class="f"><input id="u" type="email" autocomplete="email"></div>
<label>Password</label><div class="f"><input id="p" type="password"></div><button type="button" id="go" class="go">Sign in</button></div></div></main><script>
// No <form>, no submit event: a click handler "posts" with fetch, then the app swaps the view and the URL.
go.onclick=async()=>{await fetch('none.html',{method:'GET'});history.pushState({},'','/app/home');root.innerHTML='<h2>Welcome back</h2><p>Signed in.</p>';};
</script><style>.go{width:100%;height:40px;border:0;background:#0c4a6e;color:#fff;font-weight:bold;border-radius:3px}</style></body></html>
