<!doctype html><html><head><meta charset="utf-8"><title>Set up two-step sign-in</title>
<!-- A site's 2FA setup page, small enough for the e2e window (500 x 505). The test puts the QR code and the typed
     key in (#qr, #key), as a site does once you click "Turn on 2FA". Hand-written, not from make.py. -->
<style>
body{font:13px/1.4 system-ui,sans-serif;margin:0;color:#18202e;background:#f4f5f8}
main{width:150px;margin:10px;padding:10px;background:#fff;border-radius:10px}
h1{font-size:15px;margin:0 0 4px}
p{margin:4px 0}
.small{font-size:11px;color:#667}
#key{font:600 12px/1.5 ui-monospace,monospace;letter-spacing:.04em}
input{width:130px;height:26px;font:600 14px ui-monospace,monospace;letter-spacing:.3em;text-align:center}
button{margin-top:6px;height:28px}
</style></head><body>
<main>
<h1>Set up two-step sign-in</h1>
<p class="small">Use an authenticator app on your phone.</p>
<p>Scan this code:</p>
<div id="qr"></div>
<div id="alt"></div>
<label for="code">Type the code it shows</label>
<input id="code" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
<button id="go">Turn on and continue</button>
</main>
</body></html>
